<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backlink Analyzer Pro - Semrush Tool</title>
  
  <!-- Caricamento Tailwind per la grafica -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Caricamento React e Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Piccole ottimizzazioni UI */
    .tooltip-trigger:hover .tooltip-content { display: block; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  
  <div id="root"></div>

  <!-- Il codice dell'applicazione React -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- COMPONENTI ICONE ---
    const Icon = ({ path, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: path }} />
    );
    const icons = {
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
      info: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>',
      settings: '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>',
      edit: '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>',
      external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>',
      chevronLeft: '<polyline points="15 18 9 12 15 6"></polyline>',
      chevronRight: '<polyline points="9 18 15 12 9 6"></polyline>',
      x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
      spreadsheet: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h2"></path><path d="M8 17h2"></path><path d="M14 13h2"></path><path d="M14 17h2"></path>'
    };

    // --- LOGICA DI CATEGORIZZAZIONE ---
    const SPAM_TLDS = ['.xyz', '.top', '.click', '.monster', '.space', '.pw', '.cc', '.ru', '.tokyo', '.icu', '.club', '.online', '.site'];
    const SPAM_KEYWORDS = ['telegram', 'seo', 'traffic', 'backlink', 'index', 'black hat', 'pbn', 'anomaly', 'boost', 'viagra', 'cialis', 'porn', 'escort'];
    const AFFILIATE_KEYWORDS = ['quote', 'pronostic', 'bonus', 'scommess', 'match', 'bookmaker', 'comparazion', 'migliori', 'schedin', 'betting', 'casino', 'slot', 'poker', 'odds', 'freebet'];

    const categorizeRow = (rowObj, titleCounts = {}) => {
      const url = (rowObj['Source url'] || '').toLowerCase().trim();
      const title = (rowObj['Source title'] || '').toLowerCase().trim();
      const anchor = (rowObj['Anchor'] || '').toLowerCase().trim();
      const combinedText = `${url} ${title} ${anchor}`;

      let hostname = '';
      try {
        const urlObj = new URL(url.startsWith('http') ? url : `https://${url}`);
        hostname = urlObj.hostname;
      } catch (e) { }

      // Analisi Dominio / Sottodominio
      const domainParts = hostname.replace(/^www\./, '').split('.');
      // Consideriamo sottodominio se ci sono più di 2 parti (es. blog.dominio.it) ignorando casi come .co.uk (anche se rari per mercato IT)
      const isSubdomain = domainParts.length > 2 && !hostname.endsWith('.co.uk') && !hostname.endsWith('.gov.it');

      // 1. SPAM
      let isSpam = false;
      if (SPAM_TLDS.some(tld => hostname.endsWith(tld))) isSpam = true;
      if (SPAM_KEYWORDS.some(kw => combinedText.includes(kw))) isSpam = true;
      if (title && titleCounts[title] > 4) isSpam = true; 
      if (isSubdomain) isSpam = true; // Sottodomini classificati come probabile spam
      if (isSpam) return 'Spam';

      // 2. AFFILIAZIONE
      let isAffiliate = false;
      if (AFFILIATE_KEYWORDS.some(kw => combinedText.includes(kw))) isAffiliate = true;
      const isAnchorUrl = anchor.includes('www.') || anchor.startsWith('http') || (anchor.includes('.it') && !anchor.includes(' ')) || (anchor.includes('.com') && !anchor.includes(' '));
      if (isAnchorUrl) isAffiliate = true;
      const hasMoneyOrPromo = /\d+\s*(€|euro|\$|£|%)/i.test(anchor) || /[€$£]\s*\d+/.test(anchor);
      const isStrictNumber = /^\d+([.,]\d+)?$/.test(anchor);
      if (hasMoneyOrPromo || isStrictNumber) isAffiliate = true;
      if (isAffiliate) return 'Affiliazione';

      // 3. ARTICLE MARKETING
      let isArticle = false;
      const validTlds = ['.it', '.com', '.net', '.org', '.eu', '.info', '.blog'];
      const hasValidTld = validTlds.some(tld => hostname.endsWith(tld));
      
      // Deve essere un dominio principale (non sottodominio) con TLD valido
      if (hasValidTld && !isSubdomain) {
        const domainName = domainParts[0];
        
        // Anchor naturale discorsivo
        const isNaturalAnchor = anchor.includes(' ') && anchor.length > 5 && !isAnchorUrl;
        
        // Titolo naturale discorsivo
        const isNaturalTitle = title.includes(' ') && title.length > 10;
        
        // Struttura URL tipica da articolo: contiene data (es. /2026/02/) o permalink con almeno 3 trattini
        const hasArticleStructure = /\/\d{4}\/\d{2}/.test(url) || ((url.match(/-/g) || []).length >= 3);

        if (domainName.length < 25 && !combinedText.includes('forum') && !combinedText.includes('directory') && isNaturalAnchor && isNaturalTitle && hasArticleStructure) {
          isArticle = true;
        }
      }
      if (isArticle) return 'Article Marketing';

      // 4. FALLBACK
      return 'Non Categorizzato';
    };

    // Helper globale per check .it
    const isItDomain = (url) => {
      try {
        const urlStr = (url || '').toLowerCase().trim();
        return new URL(urlStr.startsWith('http') ? urlStr : `https://${urlStr}`).hostname.endsWith('.it');
      } catch(e) { return false; }
    };

    // --- PARSER CSV CUSTOM ---
    const parseCSV = (text) => {
      const rows = [];
      let row = [];
      let curr = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (inQuotes) {
          if (char === '"') {
            if (i + 1 < text.length && text[i + 1] === '"') { curr += '"'; i++; } 
            else { inQuotes = false; }
          } else { curr += char; }
        } else {
          if (char === '"') { inQuotes = true; } 
          else if (char === ',') { row.push(curr); curr = ''; } 
          else if (char === '\n' || char === '\r') {
            row.push(curr); rows.push(row); row = []; curr = '';
            if (char === '\r' && i + 1 < text.length && text[i + 1] === '\n') { i++; }
          } else { curr += char; }
        }
      }
      if (curr !== '' || row.length > 0) { row.push(curr); rows.push(row); }
      return rows.filter(r => r.length > 0 && r.some(c => c.trim() !== ''));
    };

    const convertToCSV = (dataArray, columns) => {
      const escapeCell = (cell) => {
        if (cell === null || cell === undefined) return '';
        const str = String(cell);
        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };
      const header = columns.map(escapeCell).join(',');
      const rows = dataArray.map(obj => columns.map(col => escapeCell(obj[col] || '')).join(','));
      return [header, ...rows].join('\n');
    };

    // --- COMPONENTI UI ---
    const EditableCell = ({ value, isUrl, onSave }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [val, setVal] = useState(value);

      const handleBlur = () => {
        setIsEditing(false);
        if (val !== value) onSave(val);
      };

      if (isEditing) {
        return (
          <input 
            autoFocus 
            value={val} 
            onChange={e => setVal(e.target.value)} 
            onBlur={handleBlur}
            onKeyDown={e => e.key === 'Enter' && handleBlur()}
            className="border border-blue-500 p-1 w-full text-sm text-gray-900 rounded outline-none"
          />
        );
      }

      const displayVal = value || '-';

      return (
        <div className="group flex items-center gap-2 max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg">
          <div className="truncate flex-1" title={value}>
            {isUrl && value ? (
              <a href={value.startsWith('http') ? value : `https://${value}`} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 hover:underline inline-flex items-center gap-1" onClick={e => e.stopPropagation()}>
                {displayVal} <Icon path={icons.external} size={12} className="inline opacity-50" />
              </a>
            ) : ( <span className="text-gray-700">{displayVal}</span> )}
          </div>
          <button onClick={() => setIsEditing(true)} className="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-blue-600 transition-opacity flex-shrink-0" title="Modifica cella">
            <Icon path={icons.edit} size={14} />
          </button>
        </div>
      );
    };

    // --- APP PRINCIPALE ---
    const App = () => {
      const [data, setData] = useState([]);
      const [headers, setHeaders] = useState([]);
      const [visibleColumns, setVisibleColumns] = useState([]);
      const [activeTab, setActiveTab] = useState('Tutti');
      const [isInfoOpen, setIsInfoOpen] = useState(false);
      const [isColumnsMenuOpen, setIsColumnsMenuOpen] = useState(false);
      const [titleCounts, setTitleCounts] = useState({});
      
      const [currentPage, setCurrentPage] = useState(1);
      const [pageSizeConfig, setPageSizeConfig] = useState(50);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          const parsedRows = parseCSV(text);
          if (parsedRows.length < 2) { alert("File CSV non valido o vuoto."); return; }
          
          const fileHeaders = parsedRows[0];
          const titleIdx = fileHeaders.indexOf('Source title');
          
          const newTitleCounts = {};
          if (titleIdx !== -1) {
            parsedRows.slice(1).forEach(rowArr => {
              const t = (rowArr[titleIdx] || '').toLowerCase().trim();
              if (t) newTitleCounts[t] = (newTitleCounts[t] || 0) + 1;
            });
          }
          setTitleCounts(newTitleCounts);

          const parsedData = parsedRows.slice(1).map((rowArr, index) => {
            const rowObj = { _id: index.toString() };
            fileHeaders.forEach((h, i) => { rowObj[h] = rowArr[i]; });
            rowObj.Categoria = categorizeRow(rowObj, newTitleCounts);
            return rowObj;
          });

          // ORDINAMENTO CRONOLOGICO DECRESCENTE (Basato su First seen se presente)
          parsedData.sort((a, b) => (b['First seen'] || '').localeCompare(a['First seen'] || ''));

          // PREPARAZIONE INTESTAZIONI: FORZA "First seen" IN CIMA
          const displayHeaders = [...fileHeaders];
          const fsIndex = displayHeaders.indexOf('First seen');
          if (fsIndex !== -1) displayHeaders.splice(fsIndex, 1);
          
          const headersWithCat = ['First seen', 'Categoria', ...displayHeaders];
          
          const defaultVisible = ['First seen', 'Categoria', 'Source title', 'Source url', 'Anchor', 'Page ascore'];
          const initialVisible = headersWithCat.filter(h => defaultVisible.includes(h));
          
          setHeaders(headersWithCat);
          setVisibleColumns(initialVisible.length > 0 ? initialVisible : ['First seen', 'Categoria', ...displayHeaders.slice(0, 3)]);
          setData(parsedData);
          setCurrentPage(1);
        };
        reader.readAsText(file);
      };

      const handleCellEdit = (rowId, column, newValue) => {
        setData(prev => prev.map(row => {
          if (row._id === rowId) {
            const updatedRow = { ...row, [column]: newValue };
            if (['Source url', 'Source title', 'Anchor'].includes(column)) {
              updatedRow.Categoria = categorizeRow(updatedRow, titleCounts);
            }
            return updatedRow;
          }
          return row;
        }));
      };

      const toggleColumn = (col) => {
        if (col === 'First seen') return; // Impedisce di nascondere First seen
        setVisibleColumns(prev => prev.includes(col) ? prev.filter(c => c !== col) : [...prev, col]);
      };

      const downloadFile = (content, filename) => {
        const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredData = useMemo(() => {
        if (activeTab === 'Tutti') return data;
        if (activeTab === 'Domini .it') return data.filter(d => isItDomain(d['Source url']));
        return data.filter(d => d.Categoria === activeTab);
      }, [data, activeTab]);

      // Gestione paginazione calcolata in base alla config (Numero o 'All')
      const pageSize = pageSizeConfig === 'All' ? Math.max(1, filteredData.length) : pageSizeConfig;
      const totalPages = Math.ceil(filteredData.length / pageSize);
      
      const paginatedData = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredData.slice(start, start + pageSize);
      }, [filteredData, currentPage, pageSize]);

      useEffect(() => { setCurrentPage(1); }, [activeTab, pageSizeConfig]);

      const TABS = ['Tutti', 'Spam', 'Article Marketing', 'Affiliazione', 'Non Categorizzato', 'Domini .it'];

      return (
        <div className="min-h-screen">
          <header className="bg-white shadow-sm border-b border-gray-200">
            <div className="max-w-screen-2xl mx-auto px-4 py-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-blue-600 p-2 rounded-lg text-white">
                  <Icon path={icons.spreadsheet} size={24} />
                </div>
                <div>
                  <h1 className="text-xl font-bold text-gray-900 leading-tight">Backlink Analyzer Pro</h1>
                  <p className="text-xs text-gray-500">Semrush Data Categorizer</p>
                </div>
              </div>
              
              <div className="flex items-center gap-2 w-full md:w-auto">
                <button onClick={() => setIsInfoOpen(true)} className="text-gray-500 hover:text-blue-600 hover:bg-blue-50 p-2 rounded-full transition-colors" title="Informazioni sulle logiche">
                  <Icon path={icons.info} size={20} />
                </button>
                <label className="cursor-pointer bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg shadow-sm hover:bg-gray-50 transition-colors flex items-center gap-2 text-sm font-medium">
                  <Icon path={icons.upload} size={16} />
                  <span>Carica CSV</span>
                  <input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
                </label>
              </div>
            </div>
          </header>

          <main className="max-w-screen-2xl mx-auto px-4 py-6">
            {data.length === 0 ? (
              <div className="bg-white rounded-xl border border-dashed border-gray-300 p-12 flex flex-col items-center justify-center text-center mt-10 shadow-sm">
                <div className="bg-blue-50 text-blue-500 p-4 rounded-full mb-4">
                  <Icon path={icons.upload} size={32} />
                </div>
                <h2 className="text-lg font-semibold text-gray-800 mb-2">Nessun file caricato</h2>
                <p className="text-sm text-gray-500 max-w-md">Carica un file di export dei backlink generato da Semrush (formato .csv) per iniziare l'analisi automatica.</p>
              </div>
            ) : (
              <div className="space-y-4">
                
                {/* Info Tab Domini .it */}
                {activeTab === 'Domini .it' && (
                  <div className="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded-xl text-sm flex items-start gap-3 shadow-sm">
                    <Icon path={icons.info} size={20} className="mt-0.5 flex-shrink-0 text-blue-600" />
                    <p><strong>Nota:</strong> Questa scheda filtra ed espone <em>tutti</em> i link provenienti da domini <strong>.it</strong>, senza distinzione di categoria (Spam, Affiliazione, Article, ecc.). Come richiesto, l'ordinamento rimane cronologico decrescente.</p>
                  </div>
                )}

                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col xl:flex-row justify-between gap-4 xl:items-center">
                  <div className="flex flex-wrap gap-1 bg-gray-100 p-1 rounded-lg">
                    {TABS.map(tab => {
                      const count = tab === 'Tutti' ? data.length : 
                                    tab === 'Domini .it' ? data.filter(d => isItDomain(d['Source url'])).length :
                                    data.filter(d => d.Categoria === tab).length;
                      return (
                        <button key={tab} onClick={() => setActiveTab(tab)} className={`px-3 py-1.5 text-sm font-medium rounded-md transition-all flex items-center gap-2 ${activeTab === tab ? 'bg-white text-blue-600 shadow-sm ring-1 ring-black/5' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-200'}`}>
                          {tab}
                          <span className={`text-xs px-1.5 py-0.5 rounded-full ${activeTab === tab ? 'bg-blue-100 text-blue-700' : 'bg-gray-200 text-gray-500'}`}>{count}</span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex items-center flex-wrap gap-2">
                    <div className="relative">
                      <button onClick={() => setIsColumnsMenuOpen(!isColumnsMenuOpen)} className="bg-white border border-gray-300 text-gray-700 py-1.5 px-3 rounded-lg shadow-sm hover:bg-gray-50 transition-colors flex items-center gap-2 text-sm font-medium">
                        <Icon path={icons.settings} size={16} /> <span>Gestione Colonne</span>
                      </button>
                      {isColumnsMenuOpen && (
                        <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-lg border border-gray-200 z-20 max-h-96 overflow-y-auto p-2">
                          <div className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 px-2 pt-2">Colonne visibili</div>
                          {headers.map(col => (
                            <label key={col} className={`flex items-center gap-3 p-2 rounded cursor-pointer ${col === 'First seen' ? 'opacity-50' : 'hover:bg-gray-50'}`}>
                              <input type="checkbox" checked={visibleColumns.includes(col)} disabled={col === 'First seen'} onChange={() => toggleColumn(col)} className="rounded text-blue-600 cursor-pointer disabled:cursor-not-allowed" />
                              <span className="text-sm text-gray-700 truncate">{col}</span>
                            </label>
                          ))}
                        </div>
                      )}
                    </div>
                    <button onClick={() => downloadFile(convertToCSV(filteredData, headers), `Semrush_${activeTab}.csv`)} className="bg-white border border-gray-300 text-gray-700 py-1.5 px-3 rounded-lg shadow-sm hover:bg-gray-50 transition-colors flex items-center gap-2 text-sm font-medium">
                      <Icon path={icons.download} size={16} /> <span>Scarica {activeTab}</span>
                    </button>
                    <button onClick={() => downloadFile(convertToCSV(data, headers), `Semrush_Completo.csv`)} className="bg-blue-600 text-white py-1.5 px-3 rounded-lg shadow-sm hover:bg-blue-700 transition-colors flex items-center gap-2 text-sm font-medium">
                      <Icon path={icons.download} size={16} /> <span>Scarica Tutto</span>
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                  <div className="overflow-x-auto">
                    <table className="min-w-full divide-y divide-gray-200">
                      <thead className="bg-gray-50">
                        <tr>
                          {headers.filter(h => visibleColumns.includes(h)).map(col => (
                            <th key={col} className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider whitespace-nowrap">{col}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="bg-white divide-y divide-gray-100">
                        {paginatedData.length > 0 ? (
                          paginatedData.map((row) => (
                            <tr key={row._id} className="hover:bg-gray-50/50 transition-colors group">
                              {headers.filter(h => visibleColumns.includes(h)).map(col => (
                                <td key={col} className="px-4 py-2 text-sm">
                                  {col === 'Categoria' ? (
                                    <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${row[col] === 'Spam' ? 'bg-red-100 text-red-800' : row[col] === 'Affiliazione' ? 'bg-purple-100 text-purple-800' : row[col] === 'Article Marketing' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}`}>{row[col]}</span>
                                  ) : (
                                    <EditableCell value={row[col]} isUrl={col.toLowerCase().includes('url')} onSave={(newVal) => handleCellEdit(row._id, col, newVal)} />
                                  )}
                                </td>
                              ))}
                            </tr>
                          ))
                        ) : (
                          <tr><td colSpan={visibleColumns.length} className="px-4 py-8 text-center text-gray-500 text-sm">Nessun risultato.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                  
                  {filteredData.length > 0 && (
                    <div className="bg-gray-50 px-4 py-3 border-t border-gray-200 flex flex-wrap items-center justify-between gap-4">
                      <div className="text-sm text-gray-500 flex items-center flex-wrap gap-2">
                        <span>Mostrando da <span className="font-medium">{(currentPage - 1) * pageSize + 1}</span> a <span className="font-medium">{Math.min(currentPage * pageSize, filteredData.length)}</span> di <span className="font-medium">{filteredData.length}</span> risultati</span>
                        
                        <div className="flex items-center gap-2 border-l border-gray-300 pl-3 ml-1">
                          <label htmlFor="pageSizeSelect" className="font-medium">Righe per pagina:</label>
                          <select 
                            id="pageSizeSelect" 
                            value={pageSizeConfig} 
                            onChange={(e) => setPageSizeConfig(e.target.value === 'All' ? 'All' : Number(e.target.value))} 
                            className="bg-white border border-gray-300 rounded text-sm py-1 px-2 focus:outline-none focus:ring-1 focus:ring-blue-500"
                          >
                            <option value={10}>10</option>
                            <option value={50}>50</option>
                            <option value={100}>100</option>
                            <option value={500}>500</option>
                            <option value="All">Tutte</option>
                          </select>
                        </div>
                      </div>

                      {totalPages > 1 && (
                        <div className="flex gap-2">
                          <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="p-1 rounded-md border border-gray-300 bg-white text-gray-600 disabled:opacity-50 hover:bg-gray-50">
                            <Icon path={icons.chevronLeft} size={16} />
                          </button>
                          <span className="px-3 py-1 text-sm font-medium text-gray-700">Pagina {currentPage} di {totalPages}</span>
                          <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="p-1 rounded-md border border-gray-300 bg-white text-gray-600 disabled:opacity-50 hover:bg-gray-50">
                            <Icon path={icons.chevronRight} size={16} />
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {isInfoOpen && (
            <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden">
                <div className="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50/50">
                  <h3 className="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <Icon path={icons.info} className="text-blue-600" size={20} /> Logiche di Categorizzazione (Avanzate)
                  </h3>
                  <button onClick={() => setIsInfoOpen(false)} className="text-gray-400 hover:text-gray-600 p-1">
                    <Icon path={icons.x} size={20} />
                  </button>
                </div>
                <div className="p-5 space-y-5 text-sm text-gray-600">
                  <div className="bg-red-50 border border-red-100 rounded-xl p-4">
                    <h4 className="font-semibold text-red-800 mb-2">1. Spam</h4>
                    <ul className="list-disc pl-4 space-y-1">
                      <li>Il dominio finisce per .xyz, .top, .click, ecc.</li>
                      <li>Il testo contiene termini spam: <em>telegram, seo, traffic...</em></li>
                      <li>Oltre 4 pagine differenti all'interno dell'export possiedono lo stesso esatto titolo.</li>
                      <li><strong>[Nuovo]</strong> Il link proviene da un sottodominio di terzo livello (es. <em>blog.dominio.it</em>).</li>
                    </ul>
                  </div>
                  <div className="bg-purple-50 border border-purple-100 rounded-xl p-4">
                    <h4 className="font-semibold text-purple-800 mb-2">2. Affiliazione</h4>
                    <ul className="list-disc pl-4 space-y-1">
                      <li>Il testo contiene termini relativi al betting: <em>quote, pronostici, bonus...</em></li>
                      <li>L'anchor text è una URL cruda o contiene valute (€, $) o percentuali di bonus.</li>
                      <li>L'anchor text è composto esclusivamente da numeri o decimali (es. <em>1.50</em>).</li>
                    </ul>
                  </div>
                  <div className="bg-green-50 border border-green-100 rounded-xl p-4">
                    <h4 className="font-semibold text-green-800 mb-2">3. Article Marketing</h4>
                    <ul className="list-disc pl-4 space-y-1">
                      <li>Il dominio è principale (non un sottodominio), ha estensioni standard ed è di una lunghezza naturale.</li>
                      <li>Nessuna presenza di indicatori Spam o di Affiliazione.</li>
                      <li>L'anchor text è discorsivo: contiene spazi ed è lungo almeno 6 caratteri.</li>
                      <li><strong>[Nuovo]</strong> Il titolo è discorsivo (min. 10 caratteri con spazi).</li>
                      <li><strong>[Nuovo]</strong> L'URL del link ha la tipica struttura di un articolo (contiene date nel formato <em>/anno/mese/</em> o permalink con almeno 3 trattini).</li>
                    </ul>
                  </div>
                </div>
                <div className="p-4 bg-gray-50 border-t border-gray-100 flex justify-end">
                  <button onClick={() => setIsInfoOpen(false)} className="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700">Chiudi</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
